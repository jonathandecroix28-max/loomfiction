spring.application.name=plotweaver-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/plotweaver_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:plotweaver_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${SERVER_PORT:8085}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.sql.init.mode=never

spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:change_me_admin_password}

spring.jackson.property-naming-strategy=SNAKE_CASE

app.secret-key=${JWT_SECRET:your_super_secret_jwt_key_change_it_to_something_very_long_and_secure}
app.expiration-time=${JWT_EXPIRATION:86400000}

spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

server.error.include-message=always
server.error.include-binding-errors=always

upload.dir=${UPLOAD_DIR:./uploads}
server.base.url=${SERVER_BASE_URL:http://localhost:8085}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB