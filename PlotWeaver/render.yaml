# Blueprint Render : site statique Plotweaver (plan gratuit)
# Mode d'emploi : dashboard Render → New + → Blueprint → choisis le dépôt.
services:
  - type: web
    name: plotweaver
    runtime: static
    branch: feat/mobile_desktop
    autoDeploy: true

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # les routes React (ex. /chapters/3/versions) renvoient index.html au rechargement
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # le service worker et le manifest ne doivent jamais rester en cache
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

    envVars:
      # Vite 8 demande Node 20.19+ ou 22.12+
      - key: NODE_VERSION
        value: "22"
      # synchro avec le back-end : désactivée pour l'instant (tout reste en local)
      # passe à "true" (et ajoute l'URL de ton API) le jour où le back est prêt
      - key: VITE_SYNC_ENABLED
        value: "false"