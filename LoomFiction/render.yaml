services:
  - type: web
    name: plotweaver
    runtime: static
    branch: feat/mobile_desktop
    autoDeploy: true

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: VITE_SYNC_ENABLED
        value: "false"