name: CI

on:
  pull_request:
    branches: [ main, build/workflow ]
  push:
    branches: [ main, build/workflow ]
  workflow_dispatch:  
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./LoomFiction

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'LoomFiction/package-lock.json'
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'LoomFiction/package-lock.json'
      - run: npm ci
      - run: npm test -- --ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'LoomFiction/package-lock.json'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: LoomFiction/dist
          retention-days: 7

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [ lint, test, build ]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Vérifier le résultat des jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Un job a échoué"; exit 1
          fi