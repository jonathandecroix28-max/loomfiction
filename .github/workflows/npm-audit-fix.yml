name: Audit and Fix npm Vulnerabilities

on:
  push:
    branches: [ build/workflow ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'LoomFiction/package-lock.json'

      - name: Application des correctifs
        run: |
          npm audit fix

      - name: Création d'une Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "security: correctifs automatiques npm audit"
          title: "🔒 Mise à jour de sécurité automatique (npm audit fix)"
          body: "Ce workflow a exécuté `npm audit fix` pour corriger les vulnérabilités détectées."
          branch: "auto-npm-audit-fix"
          delete-branch: true