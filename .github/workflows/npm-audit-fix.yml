name: Audit & Fix NPM

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write      

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'LoomFiction/package-lock.json'

      - name: Application des correctifs
        working-directory: ./LoomFiction
        run: npm audit fix || true

      - name: Création d'une Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "security: correctifs automatiques npm audit"
          title: "🔒 Mise à jour de sécurité automatique (npm audit fix)"
          body: "Ce workflow a exécuté `npm audit fix`. La CI est lancée automatiquement sur cette branche."
          branch: "auto-npm-audit-fix"
          base: build/workflow
          delete-branch: true

      - name: Lancer la CI sur la branche de la PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref auto-npm-audit-fix